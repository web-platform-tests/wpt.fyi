runtime: custom
env: flex
service: searchcache

# AppEngine Flex supports custom machine types with up to 32 vCPUs.
# Custom machine type specifications:
# https://cloud.google.com/compute/docs/instances/creating-instance-with-custom-machine-type#specifications
# Relevant AppEngine Flex documentation:
# https://cloud.google.com/appengine/docs/flexible/nodejs/reference/app-yaml#resource-settings
resources:
  # The searchcache is an in-memory cache of recent runs: it fills whatever
  # memory it has, evicting the oldest runs, and loads older runs on demand.
  # CPU use stays below 1%, so the instance size only sets how many days of
  # runs stay loaded. Most searches are for runs from the last few days.
  cpu: 16
  memory_gb: 103.5 # Max: FloorToNearest256MB(16 vCPU * 6.5 - 0.4) = 103.5 GB
  disk_size_gb: 20

manual_scaling:
  instances: 2

liveness_check:
  path: "/_ah/liveness_check"

readiness_check:
  path: "/_ah/readiness_check"

network:
  name: default

env_variables:
  REDISHOST: "10.171.142.203"
  REDISPORT: "6379"
