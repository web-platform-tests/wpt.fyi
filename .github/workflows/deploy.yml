name: Deploy
on:
  push:
    branches:
      - main
  pull_request:
# One run at a time per pull request branch, and one at a time for main.
# - Pull requests: App Engine rejects a deploy while another operation on the
#   same version is in progress, so a newer push waits for the deploy that is
#   already running instead of failing. The key includes the head repository,
#   so that a fork's branch with the same name doesn't share the group.
# - main: every push deploys a release and makes it the serving version, which
#   stops the version that was serving before. When runs overlap, they can
#   finish out of order, so an older commit can end up serving and a replaced
#   release can be left running without traffic until the cleanup deletes it.
#   One group for main keeps the releases in order.
# While a run is in progress, GitHub keeps only the newest waiting run of a
# group and cancels the older waiting ones, so the newest commit always deploys
# last. A running deploy is never cancelled (cancel-in-progress: false).
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('{0}:{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || github.ref }}
  cancel-in-progress: false
jobs:
  deploy-staging:
    # Forks and dependabot cannot access secrets so the job would fail.
    # Run for non dependabot PRs or regular pushes to web-platform-tests/wpt.fyi
    if: |
      (github.repository == 'web-platform-tests/wpt.fyi') &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'web-platform-tests/wpt.fyi' && github.actor != 'dependabot[bot]') ||
      (github.event_name != 'pull_request'))
    name: Deploy staging.wpt.fyi
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: webplatformtests/wpt.fyi:latest
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: secrets
        run: echo "$GCLOUD_KEY_FILE_JSON" > client-secret.json
        env:
         GCLOUD_KEY_FILE_JSON: ${{ secrets.GCLOUD_KEY_FILE_JSON }}

      - name: Set DOCKER_INSTANCE
        run: echo "DOCKER_INSTANCE=wptd-dev-$(echo $RANDOM)" >> $GITHUB_ENV

      - name: Docker config check
        uses: dorny/paths-filter@v3
        id: dockerchanges
        with:
          filters: |
            dockerconf:
              - 'Dockerfile'

      # run only if Docker configuration was changed
      - if: steps.dockerchanges.outputs.dockerconf == 'true'
        name: Rebuild Docker image
        run: docker build -t webplatformtests/wpt.fyi:latest .

      # run only if Docker configuration was not changed
      - if: steps.dockerchanges.outputs.dockerconf == 'false'
        name: Fetch latest Docker image
        run: docker pull "${DOCKER_IMAGE}"

      - name: pre-installation
        run: bash ./util/docker-dev/run.sh -d -q

      - name: installation
        run: docker exec -t "${DOCKER_INSTANCE}" make go_build;

      # Set -f for main branch.
      - name: set deployment flag
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: echo "FORCE_DEPLOYMENT=-f" >> $GITHUB_ENV

      - name: deploy webapp
        run: ./util/deploy-staging.sh "${FORCE_DEPLOYMENT}" webapp/web/app.staging.yaml

      # Right after the deploy, while App Engine moves traffic to the new
      # version, some requests to staging can fail. Wait until it consistently
      # serves the app before testing against it.
      - name: Wait for staging to serve the new version
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: ./util/wait-for-staging.sh

      - name: Run go_large_test in main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: docker exec -t "${DOCKER_INSTANCE}" make go_large_test STAGING=true

      - name: build processor
        run: ./util/deploy-staging.sh "${FORCE_DEPLOYMENT}" results-processor/app.staging.yaml

      - name: build searchcache
        run: ./util/deploy-staging.sh "${FORCE_DEPLOYMENT}" api/query/cache/service/app.staging.yaml

      - name: Clean up versions in main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: docker exec -t "${DOCKER_INSTANCE}" make cleanup_staging_versions
